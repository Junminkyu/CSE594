{% extends "base.html" %}
{% block content %}
<main class="page">
  <p class="title">Tweet {{ position + 1 }} of 5</p>
  <div class="progress"><span style="width: {{ ((position + 1) / 5) * 100 }}%"></span></div>
  <form class="panel" method="post">
    <blockquote>{{ tweet.text }}</blockquote>
    <fieldset>
      <legend>Which emotion is expressed?</legend>
      <div class="emotion-grid">
        {% for emotion in emotions %}
        <label class="emotion"><input type="radio" name="selected_label" value="{{ loop.index0 }}" required><span>{{ emotion }}</span></label>
        {% endfor %}
      </div>
    </fieldset>
    <button type="submit">{% if position == 4 %}Submit labels{% else %}Next tweet{% endif %}</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</main>
{% endblock %}
