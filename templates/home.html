{% extends "base.html" %}
{% block content %}
<main class="shell">
  <p class="eyebrow">EECS 594 Annotation Study</p>
  <h1>Emotion labeling</h1>
  <p class="intro">Read five tweets and select the emotion expressed most clearly in each one. Choose from sadness, joy, love, anger, fear, and surprise.</p>
  <form class="panel" action="{{ url_for('start_task') }}" method="post">
    <label>Participant ID<input name="participant_id" placeholder="e.g., participant-01" required></label>
    <button type="submit">Start task</button>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
  </form>
</main>
{% endblock %}
